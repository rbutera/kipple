name: New rule
description: Suggest a cache or leftover location kipple should know about.
title: "[rule] "
labels: ["rule"]
body:
  - type: markdown
    attributes:
      value: |
        kipple only touches locations in its catalogue. Each rule needs a location, a tier and two plain sentences. See "Adding a rule" in [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md).
  - type: input
    id: tool
    attributes:
      label: Tool or app
      placeholder: Example CLI 3.2
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: Location, relative to home
      placeholder: .example/cache
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Suggested tier
      options:
        - safe (rebuilds itself, cheaply)
        - review (rebuilds, but slowly or only under a condition)
        - manual (holds something only the user can judge)
        - info (measure only; the tool has its own cleanup command)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What it is
      description: One sentence for someone who has never heard of the tool.
    validations:
      required: true
  - type: textarea
    id: if-removed
    attributes:
      label: What happens if it is removed
      description: One sentence. Is anything lost that cannot be downloaded or rebuilt?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Links to the tool's docs on this folder, its own cleanup command if any, and conditions under which removing it is unsafe (tool running, unsaved work, ...).
  - type: input
    id: size
    attributes:
      label: Typical size
      placeholder: 2 to 20 GB

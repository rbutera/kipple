name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only pull requests cancel their own superseded runs. A push to main keeps
  # every commit's run, because the release gate needs a finished run for the
  # exact tagged commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.15.0
      - name: golangci-lint (gui tag)
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.15.0
          args: --build-tags gui

  test:
    name: Vet, test, build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: go vet ./...
      - name: No real home
        run: make check-no-real-home
      - name: go test -race
        run: go test -race -count=1 ./...
      - name: go build
        run: go build ./...
      - name: README agent flow against a fixture
        run: scripts/agent-flow-check.sh

  gui:
    name: GUI (gui tag)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: go vet -tags gui
        run: go vet -tags gui ./cmd/kipple-gui/...
      - name: go build -tags gui
        run: go build -tags gui ./...
      # Fyne's test driver renders in software, so these need no display.
      - name: GUI tests
        run: go test -race -count=1 -tags gui ./cmd/kipple-gui/...
      - name: Screenshots from a fixture home (software renderer)
        run: scripts/gui-screenshots.sh "${RUNNER_TEMP}/gui-screenshots"
      - name: App bundle (host build, ad-hoc signed)
        run: |
          go build -tags gui -o "${RUNNER_TEMP}/kipple-gui" ./cmd/kipple-gui
          scripts/build-app.sh "${RUNNER_TEMP}/kipple-gui" 0.0.0-ci "${RUNNER_TEMP}/kipple.app.zip"

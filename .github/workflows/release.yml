name: Release

# A v* tag publishes a GitHub Release built by goreleaser, but only when the
# CI workflow concluded success on a push (or manual run) of the very commit
# the tag points at. Fail closed: anything else stops the release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-green:
    name: CI is green on this commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the CI workflow on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Only runs that tested this exact commit count: CI started by a
          # push (or by hand) with head_sha equal to the tagged SHA. A
          # pull_request run tested a merge commit, so it does not.
          # While such a run is queued or in progress, poll for up to 30
          # minutes. If none exists yet, allow 3 minutes for GitHub to start
          # one (the tag and the commit are often pushed together), then fail.
          missing=0
          for attempt in $(seq 1 60); do
            runs=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_sha == \"${SHA}\" and (.event == \"push\" or .event == \"workflow_dispatch\")) | {id, event, status, conclusion}]")
            echo "attempt ${attempt}: ${runs}"
            if echo "${runs}" | jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' >/dev/null; then
              echo "CI succeeded for ${SHA}."
              exit 0
            fi
            if echo "${runs}" | jq -e 'length == 0' >/dev/null; then
              missing=$((missing + 1))
              if [ "${missing}" -ge 6 ]; then
                echo "::error::No CI run from a push exists for ${SHA}. Push the commit to main first, wait for CI to pass, then push the tag again."
                exit 1
              fi
            elif ! echo "${runs}" | jq -e 'any(.[]; .status != "completed")' >/dev/null; then
              echo "::error::CI did not succeed for ${SHA}; refusing to release."
              exit 1
            fi
            sleep 30
          done
          echo "::error::CI for ${SHA} did not finish within 30 minutes; refusing to release."
          exit 1

  release:
    name: Build, sign and publish
    needs: ci-green
    runs-on: macos-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # cosign keyless signing (GitHub OIDC)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          # cosign 2.6 writes both the sigstore bundle and the detached
          # checksums.txt.sig and .pem (cosign 3 writes only bundles).
          cosign-release: v2.6.5
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

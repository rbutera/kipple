# kipple release configuration (goreleaser v2).
#
# Local check, which signs nothing and publishes nothing:
#   make release-snapshot   # goreleaser release --snapshot --clean --skip=sign
#
# The release workflow (.github/workflows/release.yml) runs this on a v* tag
# once CI is green for the same commit, and signs checksums.txt with cosign
# keyless (GitHub OIDC). The CLI ships as tar.gz archives; the optional GUI
# ships separately as kipple-gui_<version>_darwin_universal.app.zip, built by
# scripts/build-app.sh from the universal kipple-gui binary (ad-hoc signed,
# not notarised), and listed in checksums.txt like every other artifact.
version: 2

project_name: kipple

before:
  hooks:
    - go mod verify

builds:
  - id: kipple
    main: ./cmd/kipple
    binary: kipple
    # The NSFileManager Trash fallback (internal/trash) is cgo.
    env:
      - CGO_ENABLED=1
    goos: [darwin]
    goarch: [arm64, amd64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }} -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      post:
        # Ad-hoc signature. Developer ID signing and notarisation are on the
        # roadmap; until then macOS may still ask before the first run.
        - cmd: codesign --force --sign - "{{ .Path }}"
          output: true

  # The optional GUI (design D13): built only with the gui tag, released
  # only as the .app zip below, never inside the CLI archives.
  - id: kipple-gui
    main: ./cmd/kipple-gui
    binary: kipple-gui
    tags: [gui]
    env:
      - CGO_ENABLED=1
    goos: [darwin]
    goarch: [arm64, amd64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"

universal_binaries:
  - id: kipple-universal
    ids: [kipple]
    name_template: kipple
    replace: false
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      post:
        - cmd: codesign --force --sign - "{{ .Path }}"
          output: true

  - id: kipple-gui-universal
    ids: [kipple-gui]
    name_template: kipple-gui
    replace: false
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      post:
        # kipple.app around the universal binary, ad-hoc signed and zipped
        # into dist/ before checksums are taken.
        - cmd: scripts/build-app.sh "{{ .Path }}" "{{ .Version }}" "dist/kipple-gui_{{ .Version }}_darwin_universal.app.zip"
          output: true

archives:
  - id: kipple
    ids: [kipple, kipple-universal]
    formats: [tar.gz]
    # kipple_0.1.0_darwin_arm64.tar.gz, ..._amd64, ..._universal
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ if eq .Arch "all" }}universal{{ else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - docs/safety.md

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: ./dist/kipple-gui_*_darwin_universal.app.zip

signs:
  # Keyless: cosign gets a short-lived certificate for the workflow's OIDC
  # identity and records the signature in the Rekor transparency log. One
  # call writes the sigstore bundle (verify with cosign 2.4+ or 3) and the
  # detached signature and certificate (verify with cosign 2).
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --new-bundle-format
      - --bundle=${artifact}.sigstore.json
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - --yes
      - ${artifact}

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^tests?:"
      - "^ci:"

release:
  github:
    owner: rbutera
    name: kipple
  # The sigstore bundle written while signing checksums.txt (above).
  extra_files:
    - glob: ./dist/checksums.txt.sigstore.json
    - glob: ./dist/kipple-gui_*_darwin_universal.app.zip
  prerelease: auto
  footer: |
    Verify the download before you run it: see "Install" in the README
    (sha256 checksums signed with cosign keyless by this repository's
    release workflow).
